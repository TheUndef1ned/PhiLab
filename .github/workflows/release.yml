name: Release

# Push a tag like v1.0.0 → signed release APK is built and attached to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PHILAB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests + signed release APK
        env:
          PHILAB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PHILAB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PHILAB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PHILAB_VERSION_NAME: ${{ github.ref_name }}
          PHILAB_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :common:testDebugUnitTest :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "PhiLab-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: PhiLab-*.apk
          generate_release_notes: true
